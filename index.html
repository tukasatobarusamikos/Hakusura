<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>放置ハクスラ ― IDLE HACK & SLASH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d13'/%3E%3Cpath d='M8 24 L20 8 L24 6 L22 12 L10 26 Z' fill='%23ffd166'/%3E%3Crect x='6' y='24' width='6' height='3' fill='%23ff9d3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d13; --bg2:#0e1119; --panel:#131722; --panel2:#181d2b;
  --line:#2a3145; --line2:#3a4360;
  --ink:#e8e4d8; --ink-dim:#9aa0b4; --ink-faint:#5c6378;
  --ember:#ff9d3d; --gold:#ffd166; --blood:#e5484d;
  --r0:#9aa3b5; --r1:#4ea3ff; --r2:#b977ff; --r3:#ff9d3d;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --font-pixel:"DotGothic16","Zen Kaku Gothic New",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,#cv{touch-action:manipulation}
#cv{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{height:100dvh;display:flex;flex-direction:column}

/* ---------- header ---------- */
#top{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#12161f 0%,var(--bg) 100%);
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--font-pixel);font-size:22px;letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 0 #5a3a00}
.brand .sub{font-family:var(--font-pixel);font-size:10px;color:var(--ink-faint);letter-spacing:.3em}
.wallet{display:flex;align-items:center;gap:14px}
.purse{display:flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);border-radius:3px}
.purse b{font-family:var(--font-pixel);font-size:16px;color:var(--gold);min-width:60px;text-align:right}
.purse .lbl{font-size:11px;color:var(--ink-dim)}
#soulVal{color:var(--r2)}
#sndBtn{
  font-family:var(--font-body);font-size:12px;color:var(--ink-dim);
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:5px 10px;cursor:pointer;
}
#sndBtn:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0}
#battleWrap{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg2)}
#panel{width:390px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}

/* floor bar */
#floorBar{
  display:flex;align-items:center;gap:12px;padding:8px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
#floorLabel{font-family:var(--font-pixel);font-size:15px;color:var(--ink);letter-spacing:.05em;min-width:120px}
#floorLabel em{font-style:normal;color:var(--ember)}
.flBtn{
  width:30px;height:30px;border:1px solid var(--line);background:var(--panel2);color:var(--ink-dim);
  cursor:pointer;border-radius:3px;font-size:12px;
}
.flBtn:hover:not(:disabled){color:var(--ember);border-color:var(--ember)}
.flBtn:disabled{opacity:.3;cursor:default}
#killDots{display:flex;gap:5px;align-items:center;margin-left:auto}
#killDots i{width:9px;height:9px;transform:rotate(45deg);background:var(--line);border:1px solid var(--line2)}
#killDots i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(255,209,102,.6)}
#killDots .bossTag{font-family:var(--font-pixel);font-size:11px;color:var(--blood);letter-spacing:.2em;margin-right:4px}

/* canvas */
#canvasHolder{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%);}
#hurtVig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  box-shadow:inset 0 0 110px rgba(229,72,77,.75);}
#bossTimer{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(340px,70%);display:none}
#bossTimer .btLabel{font-family:var(--font-pixel);text-align:center;font-size:12px;color:var(--blood);letter-spacing:.3em;margin-bottom:4px;text-shadow:0 1px 3px #000}
#bossTimer .btTrack{height:8px;background:#000;border:1px solid var(--line2)}
#bossTimer .btFill{height:100%;background:linear-gradient(90deg,var(--blood),#ff7a4d);width:100%}

/* battle controls */
#battleCtl{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px 16px;border-top:1px solid var(--line);background:var(--panel)}
#skillBtn{
  position:relative;overflow:hidden;cursor:pointer;
  font-family:var(--font-pixel);font-size:16px;letter-spacing:.1em;color:#2b1500;
  background:linear-gradient(180deg,#ffc85c,var(--ember));border:1px solid #a05a1a;
  padding:12px 34px;border-radius:4px;box-shadow:0 3px 0 #6e3c0d,0 0 18px rgba(255,157,61,.25);
}
#skillBtn:hover:not(:disabled){filter:brightness(1.08)}
#skillBtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #6e3c0d}
#skillBtn:disabled{filter:grayscale(.85) brightness(.6);cursor:default}
#skillBtn .cd{position:absolute;inset:0;background:rgba(10,10,14,.65);transform-origin:left;}
#skillBtn span{position:relative}
#hintTap{font-size:11px;color:var(--ink-faint)}
#autoSkillBtn{padding:9px 16px;font-size:12px}

/* ---------- panel ---------- */
#statRow{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
#statRow #stHp{font-size:12px}
#statRow .st{padding:9px 6px;text-align:center;border-right:1px solid var(--line)}
#statRow .st:last-child{border-right:0}
#statRow .st b{display:block;font-family:var(--font-pixel);font-size:16px;color:var(--ink)}
#statRow .st span{font-size:10px;color:var(--ink-faint);letter-spacing:.15em}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{
  flex:1;padding:10px 0;background:transparent;border:0;border-right:1px solid var(--line);
  color:var(--ink-dim);font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;
  letter-spacing:.1em;
}
#tabs button:last-child{border-right:0}
#tabs button.on{color:var(--gold);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--gold)}
#tabs button:hover:not(.on){color:var(--ink)}
#tabContent{flex:1;overflow-y:auto;padding:14px;min-height:0}
#tabContent::-webkit-scrollbar{width:8px}
#tabContent::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
#tabContent::-webkit-scrollbar-track{background:transparent}

/* log */
#log{height:118px;overflow-y:auto;border-top:1px solid var(--line);padding:8px 14px;list-style:none;background:var(--bg2)}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-thumb{background:var(--line2)}
#log li{font-size:12px;color:var(--ink-dim);padding:1px 0}
#log li .t{color:var(--ink-faint);font-size:10px;margin-right:6px}
#log li.drop{color:var(--r1)}
#log li.legend{color:var(--r3);text-shadow:0 0 8px rgba(255,157,61,.4)}
#log li.gold{color:var(--gold)}
#log li.warn{color:var(--blood)}
#log li.sys{color:var(--ink-faint)}

/* upgrades */
.buySel{display:flex;gap:6px;align-items:center;margin-bottom:10px;font-size:11px;color:var(--ink-dim)}
.buySel button{background:var(--panel2);border:1px solid var(--line);color:var(--ink-dim);padding:3px 10px;cursor:pointer;font-size:11px;border-radius:3px}
.buySel button.on{color:var(--gold);border-color:var(--gold)}
.upRow{border:1px solid var(--line);background:var(--panel2);padding:10px 12px;margin-bottom:8px;border-radius:3px}
.upRow .uHead{display:flex;justify-content:space-between;align-items:baseline}
.upRow .uName{font-weight:700;font-size:13px}
.upRow .uLv{font-family:var(--font-pixel);font-size:12px;color:var(--ember)}
.upRow .uEff{font-size:11px;color:var(--ink-dim);margin:3px 0 8px}
.upRow .uEff b{color:var(--ink)}
.buyBtn{
  width:100%;padding:7px 0;border:1px solid var(--line2);background:#1c2233;color:var(--ink);
  font-family:var(--font-pixel);font-size:13px;cursor:pointer;border-radius:3px;
}
.buyBtn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.buyBtn:disabled{opacity:.35;cursor:default}
.buyBtn .c{color:var(--gold);font-family:var(--font-body);font-size:11px;margin-left:8px}

/* equip */
.slotCard{border:1px solid var(--line);border-left:3px solid var(--r0);background:var(--panel2);padding:10px 12px;margin-bottom:8px;border-radius:3px}
.slotCard .sSlot{font-size:10px;letter-spacing:.25em;color:var(--ink-faint)}
.slotCard .sName{font-weight:700;font-size:13px;margin:2px 0 4px}
.slotCard .sName.none{color:var(--ink-faint);font-weight:400}
.slotCard .sStats{font-size:11px;color:var(--ink-dim)}
.slotCard .sStats b{color:var(--ink)}
.slotCard .sScore{font-family:var(--font-pixel);font-size:11px;color:var(--ink-faint);margin-top:4px}
.slotCard.r0{border-left-color:var(--r0)} .slotCard.r1{border-left-color:var(--r1)} .slotCard.r2{border-left-color:var(--r2)} .slotCard.r3{border-left-color:var(--r3)}
.c0{color:var(--r0)} .c1{color:var(--r1)} .c2{color:var(--r2)} .c3{color:var(--r3)}
.noteBox{font-size:11px;color:var(--ink-faint);border:1px dashed var(--line2);padding:8px 10px;border-radius:3px;margin-bottom:10px}

/* rebirth / record */
.bigNum{font-family:var(--font-pixel);font-size:26px;color:var(--r2)}
.secTitle{font-size:11px;letter-spacing:.3em;color:var(--ink-faint);margin:14px 0 8px}
.secTitle:first-child{margin-top:0}
.recGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recCell{border:1px solid var(--line);background:var(--panel2);padding:9px 12px;border-radius:3px}
.recCell b{display:block;font-family:var(--font-pixel);font-size:15px;color:var(--ink)}
.recCell span{font-size:10px;color:var(--ink-faint);letter-spacing:.1em}
.dangerBtn{
  width:100%;margin-top:8px;padding:8px 0;background:transparent;border:1px solid var(--blood);
  color:var(--blood);cursor:pointer;font-size:12px;border-radius:3px;
}
.dangerBtn:hover{background:rgba(229,72,77,.12)}
.rebirthBtn{
  width:100%;padding:14px 0;font-family:var(--font-pixel);font-size:16px;letter-spacing:.15em;cursor:pointer;
  color:#1b0b2e;background:linear-gradient(180deg,#c99bff,var(--r2));border:1px solid #7a3fd6;border-radius:4px;
  box-shadow:0 3px 0 #4d238a;
}
.rebirthBtn:disabled{filter:grayscale(.9) brightness(.55);cursor:default}
.rebirthBtn:not(:disabled):hover{filter:brightness(1.1)}
.bar{height:6px;background:#0a0c12;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--r2)}

/* modal */
#modalWrap{position:fixed;inset:0;background:rgba(5,6,10,.75);display:flex;align-items:center;justify-content:center;z-index:50}
#modalWrap.hidden{display:none}
#modal{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal h2{font-family:var(--font-pixel);font-size:18px;color:var(--gold);margin-bottom:10px;letter-spacing:.1em}
#modal .mBody{font-size:13px;color:var(--ink-dim);white-space:pre-line;margin-bottom:16px}
#modal .mBody b{color:var(--ink)}
#modal .mBtns{display:flex;gap:10px}
#modal .mBtns button{flex:1;padding:10px 0;cursor:pointer;border-radius:4px;font-size:13px;font-weight:700}
.mOk{background:var(--gold);color:#3a2800;border:1px solid #a8851e}
.mOk:hover{filter:brightness(1.08)}
.mNo{background:transparent;color:var(--ink-dim);border:1px solid var(--line2)}
.mNo:hover{color:var(--ink)}

.tglRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tglRow>span{font-size:11px;color:var(--ink-faint)}
.tgl{background:var(--panel2);border:1px solid var(--line2);color:var(--ink-dim);padding:5px 12px;cursor:pointer;font-size:11px;border-radius:3px;white-space:nowrap}
.tgl.on{color:#2b1500;background:linear-gradient(180deg,#ffc85c,var(--ember));border-color:#a05a1a;font-weight:700}
.bagHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bagHead .sortSel button{background:transparent;border:1px solid var(--line);color:var(--ink-faint);font-size:10px;padding:3px 8px;cursor:pointer}
.bagHead .sortSel button.on{color:var(--gold);border-color:var(--gold)}
.bagHead .sortSel button:first-child{border-radius:3px 0 0 3px}
.bagHead .sortSel button:last-child{border-radius:0 3px 3px 0}
.bulkBtns{display:flex;gap:6px;margin-bottom:10px}
.bulkBtns button{flex:1;background:#1c2233;border:1px solid var(--line2);color:var(--ink-dim);font-size:11px;padding:6px 4px;cursor:pointer;border-radius:3px}
.bulkBtns button:hover{color:var(--gold);border-color:var(--gold)}
.bagRow{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-left:3px solid var(--r0);background:var(--panel2);padding:8px 10px;border-radius:3px;margin-bottom:6px}
.bagRow.r1{border-left-color:var(--r1)} .bagRow.r2{border-left-color:var(--r2)} .bagRow.r3{border-left-color:var(--r3)}
.bName{font-weight:700;font-size:12.5px}
.bSlot{font-weight:400;font-size:10px;color:var(--ink-faint);margin-left:4px}
.bScore{font-family:var(--font-pixel);font-size:11px;color:var(--ink-faint);text-align:right;white-space:nowrap}
.bDiff{display:block;font-size:10px}
.bDiff.up{color:var(--gold)} .bDiff.down{color:var(--blood)}
.bBtns{display:flex;gap:5px;margin-top:5px}
.bBtns button{background:#1c2233;border:1px solid var(--line2);color:var(--ink);font-size:11px;padding:4px 12px;cursor:pointer;border-radius:3px}
.bBtns button.bEquip{color:var(--gold);border-color:var(--line2)}
.bBtns button:hover{border-color:var(--gold)}

#potionBtn{
  position:relative;overflow:hidden;cursor:pointer;
  font-family:var(--font-pixel);font-size:15px;letter-spacing:.05em;color:#0e2a12;
  background:linear-gradient(180deg,#9fe07f,#4e8f3a);border:1px solid #2f5c22;
  padding:12px 20px;border-radius:4px;box-shadow:0 3px 0 #23471a;
}
#potionBtn:active:not(:disabled){transform:translateY(2px)}
#potionBtn:disabled{filter:grayscale(.85) brightness(.6);cursor:default}
#fireBtn{
  position:relative;overflow:hidden;cursor:pointer;display:none;
  font-family:var(--font-pixel);font-size:15px;letter-spacing:.05em;color:#2e0505;
  background:linear-gradient(180deg,#ff8a5c,#c22e2e);border:1px solid #7a1616;
  padding:12px 22px;border-radius:4px;box-shadow:0 3px 0 #571010;
}
#fireBtn:active:not(:disabled){transform:translateY(2px)}
#fireBtn:disabled{filter:grayscale(.85) brightness(.6);cursor:default}
.skNode{border:1px solid var(--line);background:var(--panel2);padding:10px 12px;margin-bottom:8px;border-radius:3px}
.skNode.locked{opacity:.5}
.skNode .uHead{display:flex;justify-content:space-between;align-items:baseline}
.skNode .uName{font-weight:700;font-size:13px}
.skNode .uName.act{color:var(--r3)}
.skNode .uLv{font-family:var(--font-pixel);font-size:12px;color:var(--gold)}
.skNode .uEff{font-size:11px;color:var(--ink-dim);margin:3px 0 8px}
.plusTag{font-family:var(--font-pixel);color:var(--ember);font-size:12px}
.fuseRow{margin-top:8px}

:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* mobile */
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;min-height:100vh;min-height:100dvh}
  #main{flex-direction:column}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line)}
  #canvasHolder{height:46vh;flex:none}
  .brand h1{font-size:17px}
  .purse b{font-size:13px;min-width:44px}
  #tabs button{padding:13px 0;font-size:14px}
  .buyBtn{padding:11px 0;font-size:14px}
  .bBtns button{padding:8px 16px;font-size:12px}
  .bulkBtns button{padding:9px 4px;font-size:12px}
  #skillBtn{padding:15px 38px;font-size:18px}
  #hintTap{display:none}
  #log{height:96px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><h1>放置ハクスラ</h1><span class="sub">IDLE HACK &amp; SLASH</span></div>
    <div class="wallet">
      <div class="purse"><span class="lbl">所持金</span><b id="goldVal">0</b></div>
      <div class="purse"><span class="lbl">魂</span><b id="soulVal">0</b></div>
      <button id="sndBtn" type="button">音 ON</button>
    </div>
  </header>

  <div id="main">
    <section id="battleWrap" aria-label="戦闘">
      <div id="floorBar">
        <button class="flBtn" id="flDown" type="button" aria-label="階層を下げる">◀</button>
        <div id="floorLabel">地下 <em>1</em> 層</div>
        <div id="killDots"></div>
        <button class="flBtn" id="flUp" type="button" aria-label="階層を上げる">▶</button>
      </div>
      <div id="canvasHolder">
        <canvas id="cv"></canvas>
        <div id="vignette"></div>
        <div id="hurtVig"></div>
        <div id="bossTimer"><div class="btLabel">BOSS</div><div class="btTrack"><div class="btFill" id="bossFill"></div></div></div>
      </div>
      <div id="battleCtl">
        <button id="skillBtn" type="button"><i class="cd" id="skillCd"></i><span>渾身の一撃</span></button>
        <button id="fireBtn" type="button"><i class="cd" id="fireCd"></i><span>烈火斬</span></button>
        <button id="potionBtn" type="button">薬 ×0</button>
        <button id="autoSkillBtn" class="tgl" type="button" aria-pressed="false">自動 OFF</button>
        <span id="hintTap">モンスターをタップしても攻撃できる</span>
      </div>
    </section>

    <aside id="panel" aria-label="冒険日誌">
      <div id="statRow">
        <div class="st"><b id="stAtk">0</b><span>攻撃力</span></div>
        <div class="st"><b id="stDps">0</b><span>秒間ダメージ</span></div>
        <div class="st"><b id="stCrit">0%</b><span>クリティカル</span></div>
        <div class="st"><b id="stHp">-</b><span>HP</span></div>
      </div>
      <nav id="tabs">
        <button data-tab="equip" class="on" type="button">装備</button>
        <button data-tab="up" type="button">強化</button>
        <button data-tab="sk" type="button">スキル</button>
        <button data-tab="rebirth" type="button">転生</button>
        <button data-tab="rec" type="button">記録</button>
      </nav>
      <div id="tabContent"></div>
      <ul id="log" aria-label="冒険の記録"></ul>
    </aside>
  </div>
</div>

<div id="modalWrap" class="hidden">
  <div id="modal" role="dialog" aria-modal="true">
    <h2 id="mTitle"></h2>
    <div class="mBody" id="mBody"></div>
    <div class="mBtns" id="mBtns"></div>
  </div>
</div>

const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
function fmt(n){
  n=Math.floor(n);
  if(n<10000) return n.toLocaleString('ja-JP');
  const u=[[1e16,'京'],[1e12,'兆'],[1e8,'億'],[1e4,'万']];
  for(const [v,s] of u){ if(n>=v){ const x=n/v; const str=x>=100?String(Math.floor(x)):x.toFixed(2); return str.replace(/\.?0+$/,'')+s; } }
  return String(n);
}
function fmtTime(s){ s=Math.floor(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(h>0) return h+'時間'+m+'分'; if(m>0) return m+'分'+(s%60)+'秒'; return s+'秒'; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ================= state ================= */
const SAVE_KEY='idleHackslash_v1';
const KILL_NEED=10, BOSS_TIME=30, OFFLINE_CAP=8*3600, OFFLINE_EFF=0.6, BAG_MAX=30;
const DEF=()=>({
  v:1, gold:0, souls:0, rebirths:0,
  floor:1, runFloor:1, bestFloor:1, kills:0,
  level:1, xp:0,
  up:{atk:0,spd:0,crit:0,critd:0,goldup:0,luck:0},
  equip:{weapon:null,armor:null,ring:null,amulet:null},
  bag:[], autoEquip:false, itemsFound:0, autoSkill:false,
  potions:0, sp:0, sk:{},
  bestDmg:0, totalKills:0, totalGold:0, playSec:0, gps:0,
  skillCd:0, muted:false, lastSeen:Date.now(),
});
let S=DEF();

function deepMerge(dst,src){ for(const k in src){ if(src[k]===null||typeof src[k]!=='object'||typeof dst[k]!=='object'||dst[k]===null) dst[k]=src[k]; else deepMerge(dst[k],src[k]); } return dst; }
function load(){
  let raw=null; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return null;
  try{
    const d=JSON.parse(raw);
    S=deepMerge(DEF(),d);
    S.up=Object.assign({atk:0,spd:0,crit:0,critd:0,goldup:0,luck:0},d.up||{});
    S.bag=Array.isArray(d.bag)?d.bag:[];
    S.autoEquip=!!d.autoEquip; S.autoSkill=!!d.autoSkill;
    S.potions=d.potions||0; S.sp=d.sp||0;
    S.sk=Object.assign({atk:0,hp:0,spd:0,crit:0,critd:0,gold:0,heal:0,combo:0,fire:0,execute:0},d.sk||{});
    return d;
  }catch(e){ return null; }
}
function save(){ S.lastSeen=Date.now(); try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }

/* ================= derived ================= */
function eqSum(k){ let t=0; for(const s in S.equip){ const it=S.equip[s]; if(it) t+=(it[k]||0); } return t; }
function atkVal(){ return Math.max(1,Math.floor((5+3*S.up.atk+2*(S.level-1)+eqSum('atk'))*(1+0.02*S.souls)*(1+0.06*(S.sk.atk||0)))); }
function atkIvl(){ return Math.max(0.22,1.1*Math.pow(0.96,S.up.spd)/(1+0.03*(S.sk.spd||0))); }
function critC(){ return Math.min(0.75,0.05+0.01*S.up.crit+0.02*(S.sk.crit||0)+eqSum('crit')/100); }
function critM(){ return 1.5+0.15*S.up.critd+0.12*(S.sk.critd||0)+eqSum('critd')/100; }
function goldM(){ return (1+0.10*S.up.goldup)*(1+0.02*S.souls)*(1+0.06*(S.sk.gold||0))*(1+eqSum('gold')/100); }
function healM(){ return 1+0.5*(S.sk.heal||0); }
function xpNeed(){ return Math.floor(30*Math.pow(1.2,S.level-1)); }
function goldPerKill(){ return Math.max(1,Math.ceil(3*Math.pow(1.24,S.floor-1)*goldM())); }
function soulsGain(){ return Math.max(0,Math.floor(Math.pow(S.runFloor/10,1.6))); }
function maxHp(){ return Math.floor((60+22*(S.level-1)+eqSum('hp'))*(1+0.02*S.souls)*(1+0.08*(S.sk.hp||0))); }
function heroDef(){ return eqSum('def')+Math.floor(S.level/2); }
function mobAtk(f,g){ return Math.max(1,5*Math.pow(1.235,f-1)*g*(1+0.06*S.kills)); }

/* ================= items ================= */
const SLOTS=[['weapon','武器'],['armor','鎧'],['ring','指輪'],['amulet','護符']];
const RARITY=[
  {n:'コモン',cls:'c0',m:1,w:100},
  {n:'レア',cls:'c1',m:1.8,w:28},
  {n:'エピック',cls:'c2',m:3.2,w:6},
  {n:'レジェンド',cls:'c3',m:6.5,w:1},
];
const PFX=[
  ['古びた','旅人の','鍛冶屋の'],
  ['鋼の','銀の','紋章入りの','狼の'],
  ['竜鱗の','ルーンの','深淵の','月影の'],
  ['星砕きの','竜殺しの','王者の','終焉の'],
];
const NAMES={
  weapon:['ソード','ツルギ','大剣','双刃','戦斧','魔剣'],
  armor:['鎧','胸当て','鱗鎧','ローブ','法衣'],
  ring:['指輪','印環','封印の環','宝環'],
  amulet:['護符','お守り','ペンダント','アミュレット'],
};
function rollRarity(){
  const luckB=1+S.up.luck*0.05;
  const ws=RARITY.map((x,i)=> i===0?x.w:x.w*luckB);
  const t=ws.reduce((a,b)=>a+b,0); let r=Math.random()*t;
  for(let i=0;i<RARITY.length;i++){ if((r-=ws[i])<0) return i; }
  return 0;
}
function computeScore(it){
  return Math.round(it.atk*10+it.hp*0.9+it.def*28+it.crit*220+it.critd*40+it.gold*35);
}
function makeItem(fl){
  const slot=choice(SLOTS)[0], rI=rollRarity(), R=RARITY[rI];
  const it={slot,r:rI,name:choice(PFX[rI])+choice(NAMES[slot]),lv:fl,atk:0,crit:0,critd:0,gold:0,hp:0,def:0,plus:0};
  const scale=3*Math.pow(1.22,fl-1)*R.m;
  it.atk=Math.max(1,Math.floor(scale*rand(0.75,1.25)*(slot==='weapon'?1:0.35)));
  if(slot==='armor'){ it.hp=Math.floor(scale*rand(2.2,3.2)); it.def=Math.floor(scale*rand(0.5,0.9)); }
  if(slot==='amulet') it.hp=Math.floor(scale*rand(1.2,2.0));
  if(slot==='ring') it.def=Math.floor(scale*rand(0.3,0.6));
  const pool=['crit','critd','gold'];
  for(let i=0;i<rI;i++){
    const k=choice(pool);
    if(k==='crit') it.crit+=+(rand(1.5,4)*R.m).toFixed(1);
    else if(k==='critd') it.critd+=Math.floor(rand(6,14)*R.m);
    else it.gold+=Math.floor(rand(4,10)*R.m);
  }
  it.score=computeScore(it);
  it.value=Math.ceil(2*Math.pow(1.2,fl-1)*Math.pow(rI+1,2)*2);
  return it;
}
function fuseCost(it){ return Math.ceil(40*Math.pow(1.5,(it.plus||0))*(1+it.lv/8)); }
function itName(it){ return it.name+((it.plus||0)>0?' <span class="plusTag">+'+it.plus+'</span>':''); }
function fuseEquip(k){
  const it=S.equip[k]; if(!it) return;
  const cost=fuseCost(it);
  const mats=S.bag.filter(x=>x.slot===k).sort((a,b)=>a.score-b.score).slice(0,2);
  if(mats.length<2||S.gold<cost) return;
  for(const m of mats){ const i=S.bag.indexOf(m); if(i>=0) S.bag.splice(i,1); }
  S.gold-=cost;
  it.plus=(it.plus||0)+1;
  it.atk=Math.round(it.atk*1.09);
  it.hp=Math.round(it.hp*1.09);
  it.def=Math.round(it.def*1.09);
  it.crit=+(it.crit*1.09).toFixed(1);
  it.critd=Math.round(it.critd*1.09);
  it.gold=Math.round(it.gold*1.09);
  it.score=computeScore(it);
  it.value=Math.ceil(it.value*1.2);
  log(itName(it).replace(/<[^>]+>/g,'')+' を +'+it.plus+' に強化！（素材2点を合成）','gold');
  sfx.level(); renderTab();
}
function itemStats(it){
  const p=[];
  if(it.atk) p.push('攻撃 <b>+'+fmt(it.atk)+'</b>');
  if(it.hp) p.push('HP <b>+'+fmt(it.hp)+'</b>');
  if(it.def) p.push('守備 <b>+'+fmt(it.def)+'</b>');
  if(it.crit) p.push('クリ率 <b>+'+it.crit+'%</b>');
  if(it.critd) p.push('クリ倍率 <b>+'+it.critd+'%</b>');
  if(it.gold) p.push('獲得金 <b>+'+it.gold+'%</b>');
  return p.join(' / ');
}
function dropItem(){
  const it=makeItem(S.floor), R=RARITY[it.r];
  S.itemsFound++;
  if(S.autoEquip){
    const cur=S.equip[it.slot];
    if(!cur||it.score>cur.score){
      S.equip[it.slot]=it;
      log('【'+R.n+'】'+it.name+' を装備！ '+itemStats(it).replace(/<[^>]+>/g,''), it.r===3?'legend':(it.r>=1?'drop':'sys'));
    }else{
      sellValue(it);
      log(R.n+'「'+it.name+'」を自動売却 +'+fmt(it.value)+'G', it.r===3?'legend':'gold');
    }
  }else{
    if(S.bag.length>=BAG_MAX){
      sellValue(it);
      if(it.r>=1) log('荷物が一杯だ… '+R.n+'「'+it.name+'」を売却 +'+fmt(it.value)+'G','gold');
    }else{
      S.bag.push(it);
      log('【'+R.n+'】'+it.name+' を入手 '+itemStats(it).replace(/<[^>]+>/g,''), it.r===3?'legend':(it.r>=1?'drop':'sys'));
    }
  }
  dirty.equip=true;
}
function sellValue(it){ S.gold+=it.value; S.totalGold+=it.value; gainGps(it.value); }
let bagSort='score';
function bagSorted(){ const l=S.bag.slice(); if(bagSort==='score') l.sort((a,b)=>b.score-a.score); else l.reverse(); return l; }
function equipFromBag(i){
  const it=S.bag[i]; if(!it) return;
  const cur=S.equip[it.slot];
  if(cur) S.bag[i]=cur; else S.bag.splice(i,1);
  S.equip[it.slot]=it;
  log(it.name+' を装備 '+itemStats(it).replace(/<[^>]+>/g,''),'drop');
  sfx.coin(); dirty.equip=true; renderTab();
}
function sellFromBag(i){
  const it=S.bag[i]; if(!it) return;
  S.bag.splice(i,1); sellValue(it);
  log(it.name+' を売却 +'+fmt(it.value)+'G','gold');
  sfx.coin(); renderTab();
}
function bulkSell(mode){
  const keep=[]; let sum=0,n=0;
  for(const it of S.bag){
    let sell=false;
    if(mode==='common'&&it.r===0) sell=true;
    if(mode==='weaker'){ const cur=S.equip[it.slot]; if(cur&&it.score<cur.score) sell=true; }
    if(sell){ sum+=it.value; n++; } else keep.push(it);
  }
  if(n){
    S.bag=keep; S.gold+=sum; S.totalGold+=sum; gainGps(sum);
    log(n+'点の装備を一括売却 +'+fmt(sum)+'G','gold');
    sfx.coin(); renderTab();
  }
}

function spawnMob(){

  if(bossReady){ key=(Math.floor((f-1)/10)%2===0)?'dragon':'lich'; }

function killMob(){
  const m=mob; if(!m) return;
  const g=Math.max(1,Math.ceil(3*Math.pow(1.24,S.floor-1)*goldM()*m.M.g));
  S.gold+=g; S.totalGold+=g; gainGps(g);
  S.totalKills++;
  coinFx(m.boss?26:ri(5,9));
  sfx.die();

function gainXp(x){

}

/* ================= combat ================= */
let atkTimer=1, heroAnim=0, tapCd=0, shake=0, potCd=0, comboT=0;
let atkPhase=0, atkT=0;
let hero=null;
function initHero(){ hero={hp:maxHp(),max:maxHp(),hurt:0,dead:false,deadT:0}; }
const dmgLog=[];
function swing(mult,forceCrit){
  if(!mob||(hero&&hero.dead)) return;
  const fc=forceCrit||S.nextCrit;
  S.nextCrit=false;
  let dmg=atkVal()*mult, crit=fc||Math.random()<critC();
  if(crit) dmg*=critM();
  dmg=Math.max(1,Math.round(dmg*rand(0.9,1.1)));
  mob.hp-=dmg; mob.hurt=1; heroAnim=1; atkPhase=1; atkT=0;
  fx.push({k:'C',life:1});
  S.dmgDealt=(S.dmgDealt||0)+dmg;
  S.bestDmg=Math.max(S.bestDmg||0,dmg);
  dmgLog.push({t:performance.now(),d:dmg});
  dmgText(fmt(dmg)+(crit?'!!':''), crit);
  sparkFx(crit?16:7);
  if(crit){ shake=Math.max(shake,mult>1?10:5); sfx.crit(); } else sfx.hit();
  if(mob.hp<=0) killMob();
}
function tickCombat(dt){
  tapCd=Math.max(0,tapCd-dt);
  if(atkPhase>0){ atkT+=dt; if(atkT>0.33) atkPhase=0; }
  S.skillCd=Math.max(0,(S.skillCd||0)-dt);
  if(heroAnim>0) heroAnim=Math.max(0,heroAnim-dt/0.2);
  // hero life
  if(!hero) initHero();
  hero.max=maxHp();
  if(hero.hp>hero.max) hero.hp=hero.max;
  hero.hurt=Math.max(0,hero.hurt-dt*3);
  if(hero.dead){
    hero.deadT-=dt;
    if(hero.deadT<=0){ hero.dead=false; hero.hp=hero.max; log('冒険者は立ち上がった。狩りを再開する。','sys'); }
  }else{
    hero.hp=Math.min(hero.max,hero.hp+(hero.max*0.012+2)*dt*healM());
  }
  potCd=Math.max(0,potCd-dt);
  // auto potion
  if(!hero.dead&&S.potions>0&&potCd<=0&&hero.hp<hero.max*0.35) drinkPotion(true);
  if(mob){
    mob.born+=dt; mob.hurt=Math.max(0,mob.hurt-dt*4);
    mob.lunge=Math.max(0,mob.lunge-dt*2.5);
    if(mob.boss){
      bossT-=dt;
      if(bossT<=0){
        log(mob.M.name+' は時間切れで去った… 敵を倒して再挑戦しよう','warn');
        $('#bossTimer').style.display='none';
        S.kills=0; mob=null;
      }
    }
  }
  // monster strikes back
  if(mob&&!hero.dead){
    mob.atkT-=dt;
    if(mob.atkT<=0){
      mob.atkT=mob.M.aI*rand(0.85,1.2);
      mob.lunge=1;
      let d=mobAtk(S.floor,mob.M.d)*(mob.boss?1.5:1);
      d=Math.max(1,Math.round(d-heroDef()*0.6));
      hero.hp-=d; hero.hurt=1;
      sfx.hurt(); shake=Math.max(shake,6);
      fx.push({k:'t',str:'-'+fmt(d),crit:false,x:0.24,y:0.34,v:0.06,life:1});
      ringFx(0.26,0.62,'#e5484d');
      if(hero.hp<=0){
        hero.hp=0; hero.dead=true; hero.deadT=3.5;
        log('力尽きた… 3秒後に復帰する（この階層の討伐数はリセット）','warn');
        S.kills=0; shake=14; sfx.die();
      }
    }
  }
  if(!mob) spawnMob();
  // burning damage
  if(mob&&mob.burn&&mob.burn.t>0&&!hero.dead){
    mob.burn.t-=dt; mob.burn.acc+=dt;
    if(mob.burn.acc>=1){
      mob.burn.acc-=1;
      const d=Math.max(1,Math.round(mob.burn.dps));
      mob.hp-=d;
      fx.push({k:'t',str:fmt(d)+'炎',col:'#ff9d3d',x:0.72+rand(-0.04,0.04),y:0.34,v:0.07,life:1});
      if(mob.hp<=0){ killMob(); }
    }
  }
  // combo second swing
  if(comboT>0){
    comboT-=dt;
    if(comboT<=0&&mob&&!hero.dead) swing(1,false);
  }
  if(S.autoSkill&&(S.skillCd||0)<=0&&mob&&!hero.dead) castSkill();
  if(S.autoSkill&&(S.sk.fire||0)>0&&(S.skillCd2||0)<=0&&mob&&!hero.dead) castFire();
  atkTimer-=dt;
  if(atkTimer<=0&&mob&&!hero.dead){
    swing(1,false);
    if((S.sk.combo||0)>0) comboT=0.12;
    atkTimer=atkIvl();
  }
}

const fx=[];

function dmgText(str,crit){ fx.push({k:'t',str,crit,x:0.72+rand(-0.05,0.05),y:0.38,v:0.09,life:1}); }
function slashFx(){ fx.push({k:'s',x:0.72,y:0.55,a:rand(-0.6,-0.1),life:1}); }
function coinFx(n){ for(let i=0;i<n;i++) fx.push({k:'c',x:0.72+rand(-0.04,0.04),y:0.6,vx:rand(-0.06,0.06),vy:rand(-0.22,-0.1),life:1}); }
function sparkFx(n){ for(let i=0;i<n;i++) fx.push({k:'p',x:0.72+rand(-0.06,0.06),y:0.6+rand(-0.1,0),vx:rand(-0.2,0.2),vy:rand(-0.3,-0.02),c:Math.random()<0.4?'#ffffff':(Math.random()<0.5?'#ffd166':'#ff9d3d'),life:1}); }
function ringFx(x,y,c){ fx.push({k:'r',x,y,c,life:1}); }
function tickFx(dt){
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];
    if(f.k==='t'){ f.y-=f.v*dt*3; f.life-=dt*1.1; }
    else if(f.k==='c'){ f.x+=f.vx*dt; f.vy+=dt*0.9; f.y+=f.vy*dt; f.life-=dt*1.2; }
    else if(f.k==='p'){ f.x+=f.vx*dt; f.vy+=dt*0.9; f.y+=f.vy*dt; f.life-=dt*1.6; }
    else if(f.k==='s'){ f.life-=dt*7; }
    else if(f.k==='C'){ f.life-=dt*2.2; }
    else if(f.k==='v'){ f.life-=dt*1.6; }
    else if(f.k==='f'){ f.life-=dt*5; }
    else if(f.k==='r'){ f.life-=dt*1.4; }
    if(f.life<=0) fx.splice(i,1);
  }
  shake=Math.max(0,shake-dt*26);
}

/* ================= audio ================= */
let AC=null, noiseBuf=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function noise(){
  const a=ac(); if(!a) return null;
  if(!noiseBuf){
    noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function beep(f0,f1,dur,type,vol){
  if(S.muted) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
function hiss(dur,vol,f,q){
  if(S.muted) return; const a=ac(); if(!a||!noise()) return;
  const s=a.createBufferSource(); s.buffer=noiseBuf;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q||0.8;
  const g=a.createGain(); const tt=a.currentTime;
  g.gain.setValueAtTime(vol,tt); g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);
  s.connect(bp); bp.connect(g); g.connect(a.destination);
  s.start(tt); s.stop(tt+dur);
}

  coin:()=>beep(920,1500,.08,'sine',.045),
  level:()=>[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,f,.13,'triangle',.055),i*90)),
  skill:()=>{ beep(120,520,.22,'sawtooth',.07); setTimeout(()=>{ beep(90,38,.5,'sine',.14); hiss(.4,.12,700); },90); },
  fire:()=>{ beep(300,900,.25,'sawtooth',.06); setTimeout(()=>{ hiss(.45,.13,1200); beep(140,45,.4,'square',.08); },80); },
  potion:()=>beep(420,760,.16,'triangle',.05),
  boss:()=>{ beep(90,45,.6,'sawtooth',.09); hiss(.6,.06,300); },

const gainBuf=[];
function gainGps(g){ gainBuf.push({t:performance.now(),g}); }
function calcGps(){
  const now=performance.now();
  while(gainBuf.length&&now-gainBuf[0].t>10000) gainBuf.shift();
  if(!gainBuf.length) return 0;
  return gainBuf.reduce((a,b)=>a+b.g,0)/10;
}

  let n=0,g=S.gold,l=S.up[u.id];
  while(n<5000&&l<u.max){ const c=uCost(u,l); if(g<c) break; g-=c; l++; n++; }

  const gl=0.7+0.3*Math.sin(t*4);
  glowDot(g,0,-56,14,'rgba(120,255,190,0.8)',gl*0.6);
  g.fillStyle='rgba(150,255,210,'+gl+')';
  g.beginPath(); g.arc(-5,-56,2.5,0,7); g.arc(5,-56,2.5,0,7); g.fill();
  g.fillStyle='#ffd166';
  g.beginPath(); g.moveTo(-10,-66); g.lineTo(-10,-74); g.lineTo(-5,-68); g.lineTo(0,-76); g.lineTo(5,-68); g.lineTo(10,-74); g.lineTo(10,-66); g.closePath(); g.fill();
  g.strokeStyle='#3d2f63'; g.lineWidth=4;
  g.beginPath(); g.moveTo(22,-2); g.lineTo(22,-66); g.stroke();
  glowDot(g,22,-70,18,'rgba(120,255,190,0.8)',0.8);
  g.fillStyle='rgba(160,255,215,'+gl+')';
  g.beginPath(); g.arc(22,-70,6+Math.sin(t*5)*1.5,0,7); g.fill();
  g.restore();
}
function grad(g,x0,y0,x1,y1,c0,c1){ const q=g.createLinearGradient(x0,y0,x1,y1); q.addColorStop(0,c0); q.addColorStop(1,c1); return q; }
function glowDot(g,x,y,r,c,a){
  const q=g.createRadialGradient(x,y,0,x,y,r);
  q.addColorStop(0,c); q.addColorStop(1,'rgba(0,0,0,0)');
  g.save(); g.globalAlpha=(a===undefined?1:a); g.fillStyle=q;
  g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.restore();
}
function eye(g,x,y,glow){
  g.fillStyle='#fff'; g.beginPath(); g.arc(x,y,6,0,7); g.fill();
  g.fillStyle='#12141c'; g.beginPath(); g.arc(x+1.5,y+1,3,0,7); g.fill();
  if(glow) glowDot(g,x,y,10,glow,0.5);
}
function drawMob(t){
  if(!mob) return;
  const sc=(mob.boss?1.5:1.05)*Math.min(1.3,W/720);
  mg.clearRect(0,0,240,240);
  mg.save(); mg.translate(120,232);
  const sq=1+Math.sin(t*4.2)*0.02;
  mg.scale(sq,1/sq*1.02);
  mob.M.draw(mg,t,mob);
  mg.restore();
  if(mob.hurt>0){
    mg.globalCompositeOperation='source-atop';
    mg.fillStyle='rgba(255,255,255,'+(mob.hurt*0.8)+')';
    mg.fillRect(0,0,240,240);
    mg.globalCompositeOperation='source-over';
  }
  const mx=W*0.72-mob.lunge*60*sc, my=H*0.82;
  ctx.save();
  if(mob.boss){
    const q=ctx.createRadialGradient(mx,H*0.6,10,mx,H*0.6,150*sc);
    q.addColorStop(0,'rgba(229,72,77,0.20)'); q.addColorStop(1,'rgba(229,72,77,0)');
    ctx.fillStyle=q; ctx.fillRect(mx-160*sc,H*0.6-160*sc,320*sc,320*sc);
  }
  ctx.globalAlpha=0.92;
  ctx.drawImage(mCv,mx-120*sc,my-232*sc,240*sc,240*sc);
  ctx.restore();
  // name + hp bar
  const bw=mob.boss?220:130, bx=mx-bw/2, by=my-(mob.boss?250:215)*sc;
  ctx.font=(mob.boss?'16px':'13px')+' DotGothic16, sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle=mob.boss?'#ff8a8a':'rgba(255,255,255,0.85)';
  ctx.fillText(mob.M.name+(mob.boss?' 〔BOSS〕':''),mx,by-8);
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx-1,by-1,bw+2,9);
  ctx.fillStyle='#2a3145'; ctx.fillRect(bx,by,bw,7);
  const r=clamp(mob.hp/mob.max,0,1);
  ctx.fillStyle=mob.boss?'#e5484d':'#7dc95e';
  ctx.fillRect(bx,by,bw*r,7);
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.strokeRect(bx-0.5,by-0.5,bw+1,8);
}
function drawFx(t){
  const mx=W*0.72,my=H*0.82;
  for(const f of fx){
    const x=f.x*W, y=f.y*H;
    if(f.k==='t'){
      const pop=1+(1-f.life)*0.35;
      ctx.font=Math.round((f.crit?26:18)*pop)+'px DotGothic16, sans-serif';
      ctx.textAlign='center';
      ctx.globalAlpha=clamp(f.life,0,1);
      ctx.fillStyle='#000'; ctx.fillText(f.str,x+2,y+2);
      ctx.fillStyle=f.col||(f.crit?'#ffd166':(f.str[0]==='-'?'#ff8a8a':'#f2ede0'));
      ctx.fillText(f.str,x,y);
      ctx.globalAlpha=1;
    }else if(f.k==='C'){
      const prog=1-f.life;
      const cx=W*0.26+40, cy=H*0.55, R=H*0.62;
      const A=-1.35+prog*2.3;
      for(const [wd,al,col] of [[24,0.22,'#ffe9b0'],[10,0.55,'#fff'],[3.5,1,'#fff']]){
        ctx.globalAlpha=clamp(f.life,0,1)*al;
        ctx.strokeStyle=col; ctx.lineWidth=wd; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(cx,cy,R,A-1.05,A); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }else if(f.k==='s'){
      ctx.save(); ctx.translate(x,y-40); ctx.rotate(f.a);
      ctx.globalAlpha=f.life*0.9;
      const sg=ctx.createLinearGradient(0,0,60,0);
      sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.7,'#fff'); sg.addColorStop(1,'#ffe9b0');
      ctx.strokeStyle=sg; ctx.lineWidth=8*f.life; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(0,0,52,-0.9,0.5); ctx.stroke();
      ctx.restore(); ctx.globalAlpha=1;
    }else if(f.k==='v'){
      ctx.save();
      ctx.globalAlpha=clamp(f.life,0,1)*0.9;
      const bw=70*f.life;
      const vg=ctx.createLinearGradient(mx-bw/2,0,mx+bw/2,0);
      vg.addColorStop(0,'rgba(255,209,102,0)'); vg.addColorStop(0.5,'#fff'); vg.addColorStop(1,'rgba(255,209,102,0)');
      ctx.fillStyle=vg;
      ctx.fillRect(mx-bw/2,0,bw,H);
      ctx.restore();
    }else if(f.k==='f'){
      ctx.save();
      ctx.globalAlpha=clamp(f.life,0,1)*0.45;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }else if(f.k==='c'){
      ctx.globalAlpha=clamp(f.life,0,1);
      ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
      ctx.fillStyle='#a8851e'; ctx.fillRect(x-3,y-1,6,1.5);
      ctx.globalAlpha=1;
      if(Math.random()<0.03) sfx.coin();
    }else if(f.k==='p'){
      ctx.globalAlpha=clamp(f.life,0,1);
      ctx.fillStyle=f.c; ctx.fillRect(x-2,y-2,4,4);
      ctx.globalAlpha=1;
    }else if(f.k==='r'){
      ctx.globalAlpha=clamp(f.life,0,1)*0.8;
      ctx.strokeStyle=f.c; ctx.lineWidth=4*f.life;
      ctx.beginPath(); ctx.arc(x,y,(1-f.life)*140+10,0,7); ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
}
function draw(t){
  ctx.setTransform(dprS,0,0,dprS,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0) ctx.translate(rand(-shake,shake),rand(-shake,shake)*0.6);
  drawBg(t);
  // mob shadow
  if(mob){ ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(W*0.72,H*0.82+2,(mob.boss?66:44),10,0,0,7); ctx.fill(); }
  drawHero(t);
  drawMob(t);
  drawFx(t);
  ctx.restore();
}

function rec(l,v){ return '<div class="recCell"><span>'+l+'</span><b>'+v+'</b></div>'; }
function updateUp(){
  UPS.forEach((u,i)=>{
    const r=refsUp[i]; if(!r||!r.btn) return;
    const l=S.up[u.id];
    r.lv.textContent='Lv '+l;
    const atMax=l>=u.max;
    let costTxt,dis;
    if(atMax){ costTxt='MAX'; dis=true; }
    else if(buyMode==='max'){ const n=maxAffordable(u); costTxt='×'+n+'（1個 '+fmt(uCost(u,l))+'G）'; dis=n<1; }
    else{
      let tot=0,l2=l;
      for(let k=0;k<buyMode;k++){ tot+=uCost(u,l2+k); }
      costTxt=fmt(tot)+'G'; dis=S.gold<tot;
    }
    r.btn.childNodes[0].textContent='Lv '+Math.min(l+1,u.max)+' へ';
    r.btn.querySelector('.c').textContent=costTxt;
    r.btn.disabled=dis;
  });
}
function askRebirth(){

    mob=null; atkTimer=1;

function askWipe(){

const mWrap=$('#modalWrap');
function modal(title,body,okLabel,onOk,noLabel){
  $('#mTitle').textContent=title;
  $('#mBody').innerHTML=body;
  const btns=$('#mBtns'); btns.innerHTML='';
  const ok=document.createElement('button'); ok.className='mOk'; ok.textContent=okLabel;
  ok.addEventListener('click',()=>{ mWrap.classList.add('hidden'); onOk&&onOk(); });
  btns.appendChild(ok);
  if(noLabel!==null){
    const no=document.createElement('button'); no.className='mNo'; no.textContent=noLabel||'キャンセル';
    no.addEventListener('click',()=>mWrap.classList.add('hidden'));
    btns.appendChild(no);
  }
  mWrap.classList.remove('hidden');
}

}
function hud(){
  els.gold.textContent=fmt(S.gold);
  els.soul.textContent=S.souls;
  els.atk.textContent=fmt(atkVal());
  els.crit.textContent=Math.round(critC()*100)+'%';
  els.hp.textContent=fmt(hero?Math.ceil(hero.hp):maxHp())+' / '+fmt(maxHp());
  const lowVig=hero?clamp((1-hero.hp/hero.max-0.55)/0.45,0,1)*0.7:0;
  els.vig.style.opacity=Math.max(lowVig,hero&&hero.hurt>0?hero.hurt*0.5:0).toFixed(2);
  const now=performance.now();
  while(dmgLog.length&&now-dmgLog[0].t>3000) dmgLog.shift();
  const dps=dmgLog.reduce((a,b)=>a+b.d,0)/3;
  els.dps.textContent=fmt(dps);
  els.floor.innerHTML='地下 <em>'+S.floor+'</em> 層';
  const bossFloor=S.floor%10===0;
  [...els.dots.children].forEach((d,i)=>d.classList.toggle('on',bossFloor?true:i<S.kills));
  els.up.disabled=S.floor>=S.runFloor;
  els.down.disabled=S.floor<=1;
  // skill
  const cd=S.skillCd||0;
  els.skillCdEl.style.transform='scaleX('+(cd/15)+')';
  els.skill.disabled=cd>0;
  const cd2=S.skillCd2||0;
  els.fireCd.style.transform='scaleX('+(cd2/8)+')';
  els.fire.disabled=cd2>0;
  els.fire.style.display=(S.sk.fire||0)>0?'':'none';
  els.pot.textContent='薬 ×'+S.potions;
  els.pot.disabled=S.potions<=0;
  // boss
  if(mob&&mob.boss) els.bossFill.style.width=(bossT/BOSS_TIME*100)+'%';
  // rebirth tab live
  if(curTab==='rebirth'){
    const big=tabContent.querySelectorAll('.bigNum');
    if(big.length>=2){ big[0].textContent=S.souls; big[1].textContent='+'+soulsGain(); }
    const bar=tabContent.querySelector('.bar i'); if(bar) bar.style.width=Math.min(100,S.runFloor/25*100)+'%';
    const btn=$('#rebirthBtn'); if(btn) btn.disabled=S.runFloor<25;
  }
  if(curTab==='rec'){
    const cells=tabContent.querySelectorAll('.recCell b');
    if(cells.length>=8){
      cells[0].textContent=fmt(S.totalKills)+' 体';
      cells[1].textContent=fmt(S.totalGold)+' G';
      cells[2].textContent=S.bestFloor+' 層';
      cells[3].textContent=S.rebirths+' 回';
      cells[4].textContent=fmt(S.bestDmg||0);
      cells[5].textContent=fmtTime(S.playSec);
      cells[6].textContent=fmt(S.itemsFound)+' 点';
      cells[7].textContent=S.bag.length+' / '+BAG_MAX;
    }
  }
  if(curTab==='sk'){
    const rs=$('#respecBtn');
    if(rs){
      const tot=skTotal(), rCost=respecCost();
      rs.disabled=!(tot&&S.gold>=rCost);
      rs.textContent=tot?'振り直し（'+fmt(rCost)+'G）':'振り直すスキルがない';
    }
  }
}

/* ================= input ================= */
cv.addEventListener('pointerdown',e=>{
  if(tapCd>0) return; tapCd=0.09;
  swing(1,false);
});
els.skill.addEventListener('click',()=>castSkill());
els.fire.addEventListener('click',()=>castFire());
els.pot.addEventListener('click',()=>drinkPotion(false));
function castSkill(){
  if((S.skillCd||0)>0||!mob) return;
  S.skillCd=15;
  sfx.skill(); shake=Math.max(shake,12);
  ringFx(0.72,0.6,'#ffd166');
  fx.push({k:'f',life:1});
  fx.push({k:'v',life:1});
  fx.push({k:'C',life:1});
  fx.push({k:'s',x:0.72,y:0.55,a:-0.55,life:1});
  fx.push({k:'s',x:0.72,y:0.55,a:0.55,life:1});
  swing(12,true);
}
function castFire(){
  if((S.skillCd2||0)>0||!mob||!S.sk.fire) return;
  S.skillCd2=8;
  sfx.fire(); shake=Math.max(shake,9);
  ringFx(0.72,0.6,'#ff9d3d');
  fx.push({k:'s',x:0.72,y:0.55,a:-0.9,life:1});
  fx.push({k:'s',x:0.72,y:0.55,a:0.9,life:1});
  fx.push({k:'f',life:0.6});
  swing(6,false);
  if(mob){ mob.burn={dps:atkVal()*0.8,t:3,acc:0}; log(mob.M.name+' に灼熱が燃え移る！','warn'); }
}
function drinkPotion(auto){
  if(!hero||hero.dead||S.potions<=0||hero.hp>=hero.max) return;
  S.potions--; potCd=8;
  const heal=Math.round(hero.max*0.4*healM());
  hero.hp=Math.min(hero.max,hero.hp+heal);
  fx.push({k:'t',str:'+'+fmt(heal),col:'#7dc95e',x:0.24,y:0.34,v:0.06,life:1});
  ringFx(0.26,0.62,'#7dc95e');
  sfx.potion();
  log((auto?'危機を察して回復薬を飲んだ':'回復薬を飲んだ')+'（残り '+S.potions+'）','drop');
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.repeat&&curTab!=='up'){ e.preventDefault(); els.skill.click(); }
});
$('#flDown').addEventListener('click',()=>{ if(S.floor>1){ S.floor--; S.kills=0; mob=null; $('#bossTimer').style.display='none'; } });
$('#flUp').addEventListener('click',()=>{ if(S.floor<S.runFloor){ S.floor++; S.kills=0; mob=null; $('#bossTimer').style.display='none'; } });
$('#sndBtn').addEventListener('click',()=>{ S.muted=!S.muted; $('#sndBtn').textContent=S.muted?'音 OFF':'音 ON'; if(!S.muted) sfx.coin(); save(); });
const autoSkillBtn=$('#autoSkillBtn');
autoSkillBtn.addEventListener('click',()=>{
  S.autoSkill=!S.autoSkill;
  autoSkillBtn.textContent=S.autoSkill?'自動 ON':'自動 OFF';
  autoSkillBtn.classList.toggle('on',S.autoSkill);
  autoSkillBtn.setAttribute('aria-pressed',String(S.autoSkill));
  log(S.autoSkill?'渾身の一撃を自動で放つようになった。':'スキルの自動発動を止めた。','sys');
  sfx.coin(); save();
});
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); curTab=b.dataset.tab; renderTab();
}));
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
window.addEventListener('beforeunload',save);

/* ================= boot ================= */
const prev=load();
resize(); buildDots(); initHero();
if(S.muted) $('#sndBtn').textContent='音 OFF';
if(S.autoSkill){ autoSkillBtn.textContent='自動 ON'; autoSkillBtn.classList.add('on'); autoSkillBtn.setAttribute('aria-pressed','true'); }
// offline progress
if(prev&&S.gps>0){
  const elapsed=Math.min(OFFLINE_CAP,(Date.now()-(prev.lastSeen||Date.now()))/1000);
  if(elapsed>90){
    const g=Math.floor(S.gps*elapsed*OFFLINE_EFF);
    if(g>0){
      S.gold+=g; S.totalGold+=g;
      const kills=Math.max(1,Math.floor(g/Math.max(1,goldPerKill())));
      S.totalKills+=kills;
      const hrs=fmtTime(elapsed);
      setTimeout(()=>modal('おかえりなさい','冒険者が'+hrs+'の間、ひとりで狩りを続けていた。\n\n獲得ゴールド：<b>+'+fmt(g)+' G</b>\n撃破数： <b>約 '+fmt(kills)+' 体</b>\n（オフライン効率 60%）','冒険に戻る',null,null),300);
    }
  }
}
log('地下牢の最奥で、冒険者は剣を構えた。討伐は自動 ― お前は見届けるだけだ。','sys');
renderTab(); hud();
let last=performance.now(), uiT=0, saveT=0;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  S.playSec+=dt;
  tickCombat(dt); tickFx(dt);
  S.gps=calcGps();
  uiT+=dt; if(uiT>0.15){ uiT=0; hud(); if(curTab==='up') updateUp(); if(dirty.equip&&curTab==='equip'){ dirty.equip=false; renderTab(); } if(dirty.up&&curTab==='up'){ dirty.up=false; renderTab(); } }
  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  draw(now/1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
